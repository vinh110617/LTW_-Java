<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên</title>
    <!-- Bootstrap 5 CSS & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { width: 220px; height: 100vh; position: fixed; background-color: #1a1d20; color: #fff; top: 0; left: 0; }
        .sidebar .brand { padding: 20px 15px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #2d3238; }
        .sidebar ul { list-style: none; padding: 0; margin-top: 10px; }
        .sidebar ul li a { display: block; padding: 12px 20px; color: #a0a5ab; text-decoration: none; }
        .sidebar ul li.active a, .sidebar ul li a:hover { background-color: #2b3035; color: #fff; }
        .main-content { margin-left: 220px; padding: 20px 30px; }
        .card-header-actions { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">University Training</div>
        <ul>
            <li class="active"><a href="student.html"><i class="fa-solid fa-users me-2"></i> Sinh viên</a></li>
            <li><a href="course.html"><i class="fa-solid fa-book me-2"></i> Học phần</a></li>
            <li><a href="room.html"><i class="fa-solid fa-building me-2"></i> Phòng học</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Quản lý sinh viên</h2>
            <span class="text-muted">Home / Sinh viên</span>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <!-- Header card: Title & Button Add -->
                <div class="card-header-actions mb-3">
                    <h5 class="card-title m-0"><i class="fa-solid fa-users me-2"></i>Danh sách sinh viên</h5>
                    <button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus me-1"></i> Thêm sinh viên</button>
                </div>

                <!-- Search Form -->
                <div class="row g-2 mb-4">
                    <div class="col-md-5">
                        <input type="text" id="searchInput" class="form-control" placeholder="Tìm mã SV, họ tên, email..." onkeypress="if(event.key === 'Enter') searchStudents()">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="searchStudents()"><i class="fa-solid fa-magnifying-glass me-1"></i> Tìm kiếm</button>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>STT</th>
                                <th>Mã sinh viên</th>
                                <th>Họ và tên</th>
                                <th>Email</th>
                                <th>Số điện thoại</th>
                                <th>Lớp</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <!-- Dữ liệu JS sẽ đổ vào đây -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Thêm / Sửa Sinh Viên -->
    <div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm sinh viên mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="studentForm">
                        <input type="hidden" id="studentId">
                        <div class="mb-3">
                            <label for="studentCode" class="form-label">Mã sinh viên</label>
                            <input type="text" class="form-control" id="studentCode" required>
                        </div>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Họ và tên</label>
                            <input type="text" class="form-control" id="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" id="phone">
                        </div>
                        <div class="mb-3">
                            <label for="className" class="form-label">Lớp</label>
                            <input type="text" class="form-control" id="className">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="saveStudent()">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = 'http://localhost:8888/api/students';
        let studentModal;

        document.addEventListener('DOMContentLoaded', () => {
            studentModal = new bootstrap.Modal(document.getElementById('studentModal'));
            loadStudents();
        });

        // 1. Tải danh sách sinh viên
        function loadStudents() {
            fetch(API_URL)
                .then(res => {
                    if (!res.ok) throw new Error('Không thể lấy dữ liệu từ Server');
                    return res.json();
                })
                .then(data => renderTable(data))
                .catch(err => {
                    console.error('Lỗi lấy dữ liệu:', err);
                    document.getElementById('studentTableBody').innerHTML = 
                        `<tr><td colspan="7" class="text-center text-danger">Lỗi kết nối Server! Vui lòng kiểm tra lại backend.</td></tr>`;
                });
        }

        // 2. Tìm kiếm sinh viên
        function searchStudents() {
            const keyword = document.getElementById('searchInput').value.trim();
            const url = keyword ? `${API_URL}?keyword=${encodeURIComponent(keyword)}` : API_URL;
            
            fetch(url)
                .then(res => res.json())
                .then(data => renderTable(data))
                .catch(err => console.error('Lỗi tìm kiếm:', err));
        }

        // 3. Hiển thị bảng dữ liệu
        function renderTable(students) {
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';

            if (!students || students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Không tìm thấy sinh viên nào</td></tr>';
                return;
            }

            students.forEach((sv, index) => {
                const id = sv.id;
                const code = sv.studentCode || sv.student_code || '';
                const name = sv.fullName || sv.full_name || '';
                const email = sv.email || '';
                const phone = sv.phone || '';
                const className = sv.className || sv.class_name || '';

                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${code}</td>
                        <td>${name}</td>
                        <td>${email}</td>
                        <td>${phone}</td>
                        <td>${className}</td>
                        <td>
                            <button class="btn btn-warning btn-sm text-white me-1" onclick="openEditModal('${id}')"><i class="fa-solid fa-pen me-1"></i>Sửa</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteStudent('${id}')"><i class="fa-solid fa-trash me-1"></i>Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 4. Mở Modal Thêm mới
        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'Thêm sinh viên mới';
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            studentModal.show();
        }

        // 5. Mở Modal Sửa (Lấy thông tin cũ điền vào form)
        function openEditModal(id) {
            document.getElementById('modalTitle').innerText = 'Cập nhật thông tin sinh viên';
            fetch(`${API_URL}/${id}`)
                .then(res => res.json())
                .then(sv => {
                    document.getElementById('studentId').value = sv.id;
                    document.getElementById('studentCode').value = sv.studentCode || sv.student_code || '';
                    document.getElementById('fullName').value = sv.fullName || sv.full_name || '';
                    document.getElementById('email').value = sv.email || '';
                    document.getElementById('phone').value = sv.phone || '';
                    document.getElementById('className').value = sv.className || sv.class_name || '';
                    studentModal.show();
                })
                .catch(err => {
                    console.error('Lỗi lấy chi tiết sinh viên:', err);
                    alert('Không thể tải thông tin sinh viên!');
                });
        }

        // 6. Xử lý Lưu (Thêm mới hoặc Cập nhật)
        function saveStudent() {
            const id = document.getElementById('studentId').value;
            const studentData = {
                studentCode: document.getElementById('studentCode').value.trim(),
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                className: document.getElementById('className').value.trim()
            };

            if (!studentData.studentCode || !studentData.fullName) {
                alert('Vui lòng nhập Mã sinh viên và Họ tên!');
                return;
            }

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(studentData)
            })
            .then(res => {
                if (!res.ok) throw new Error('Lưu thất bại');
                return res.json();
            })
            .then(() => {
                studentModal.hide();
                loadStudents();
            })
            .catch(err => {
                console.error('Lỗi lưu:', err);
                alert('Có lỗi xảy ra khi lưu dữ liệu!');
            });
        }

        // 7. Xóa sinh viên
        function deleteStudent(id) {
            if (confirm('Bạn có chắc chắn muốn xóa sinh viên này không?')) {
                fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                })
                .then(res => {
                    if (!res.ok) throw new Error('Xóa thất bại');
                    loadStudents();
                })
                .catch(err => {
                    console.error('Lỗi xóa:', err);
                    alert('Không thể xóa sinh viên này!');
                });
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý phòng học</title>
    <!-- Bootstrap 5 CSS & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { width: 220px; height: 100vh; position: fixed; background-color: #1a1d20; color: #fff; top: 0; left: 0; }
        .sidebar .brand { padding: 20px 15px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #2d3238; }
        .sidebar ul { list-style: none; padding: 0; margin-top: 10px; }
        .sidebar ul li a { display: block; padding: 12px 20px; color: #a0a5ab; text-decoration: none; }
        .sidebar ul li.active a, .sidebar ul li a:hover { background-color: #2b3035; color: #fff; }
        .main-content { margin-left: 220px; padding: 20px 30px; }
        .card-header-actions { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">University Training</div>
        <ul>
            <li><a href="student.html"><i class="fa-solid fa-users me-2"></i> Sinh viên</a></li>
            <li><a href="course.html"><i class="fa-solid fa-book me-2"></i> Học phần</a></li>
            <li class="active"><a href="room.html"><i class="fa-solid fa-building me-2"></i> Phòng học</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Quản lý phòng học</h2>
            <span class="text-muted">Home / Phòng học</span>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <!-- Header card: Title & Button Add -->
                <div class="card-header-actions mb-3">
                    <h5 class="card-title m-0"><i class="fa-solid fa-building me-2"></i>Danh sách phòng học</h5>
                    <button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus me-1"></i> Thêm phòng học</button>
                </div>

                <!-- Search Form -->
                <div class="row g-2 mb-4">
                    <div class="col-md-5">
                        <input type="text" id="searchInput" class="form-control" placeholder="Tìm mã phòng, tên phòng..." onkeypress="if(event.key === 'Enter') searchRooms()">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="searchRooms()"><i class="fa-solid fa-magnifying-glass me-1"></i> Tìm kiếm</button>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>STT</th>
                                <th>Mã phòng</th>
                                <th>Tên phòng</th>
                                <th>Sức chứa</th>
                                <th>Tòa nhà</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="roomTableBody">
                            <!-- Dữ liệu JS sẽ đổ vào đây -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Thêm / Sửa Phòng Học -->
    <div class="modal fade" id="roomModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm phòng học mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="roomForm">
                        <input type="hidden" id="roomId">
                        <div class="mb-3">
                            <label for="roomCode" class="form-label">Mã phòng</label>
                            <input type="text" class="form-control" id="roomCode" required>
                        </div>
                        <div class="mb-3">
                            <label for="roomName" class="form-label">Tên phòng</label>
                            <input type="text" class="form-control" id="roomName" required>
                        </div>
                        <div class="mb-3">
                            <label for="capacity" class="form-label">Sức chứa</label>
                            <input type="number" class="form-control" id="capacity">
                        </div>
                        <div class="mb-3">
                            <label for="building" class="form-label">Tòa nhà</label>
                            <input type="text" class="form-control" id="building">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="saveRoom()">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = 'http://localhost:8888/api/rooms'; // Thay đổi Endpoint API nếu cần thiết
        let roomModal;

        document.addEventListener('DOMContentLoaded', () => {
            roomModal = new bootstrap.Modal(document.getElementById('roomModal'));
            loadRooms();
        });

        // 1. Tải danh sách phòng học
        function loadRooms() {
            fetch(API_URL)
                .then(res => {
                    if (!res.ok) throw new Error('Không thể lấy dữ liệu từ Server');
                    return res.json();
                })
                .then(data => renderTable(data))
                .catch(err => {
                    console.error('Lỗi lấy dữ liệu:', err);
                    document.getElementById('roomTableBody').innerHTML = 
                        `<tr><td colspan="6" class="text-center text-danger">Lỗi kết nối Server hoặc chưa có API phòng học!</td></tr>`;
                });
        }

        // 2. Tìm kiếm phòng học
        function searchRooms() {
            const keyword = document.getElementById('searchInput').value.trim();
            const url = keyword ? `${API_URL}?keyword=${encodeURIComponent(keyword)}` : API_URL;
            
            fetch(url)
                .then(res => res.json())
                .then(data => renderTable(data))
                .catch(err => console.error('Lỗi tìm kiếm:', err));
        }

        // 3. Hiển thị bảng dữ liệu
        function renderTable(rooms) {
            const tbody = document.getElementById('roomTableBody');
            tbody.innerHTML = '';

            if (!rooms || rooms.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Không tìm thấy phòng học nào</td></tr>';
                return;
            }

            rooms.forEach((room, index) => {
                const id = room.id;
                const code = room.roomCode || room.room_code || '';
                const name = room.roomName || room.room_name || '';
                const capacity = room.capacity || '';
                const building = room.building || '';

                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${code}</td>
                        <td>${name}</td>
                        <td>${capacity}</td>
                        <td>${building}</td>
                        <td>
                            <button class="btn btn-warning btn-sm text-white me-1" onclick="openEditModal('${id}')"><i class="fa-solid fa-pen me-1"></i>Sửa</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteRoom('${id}')"><i class="fa-solid fa-trash me-1"></i>Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 4. Mở Modal Thêm mới
        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'Thêm phòng học mới';
            document.getElementById('roomForm').reset();
            document.getElementById('roomId').value = '';
            roomModal.show();
        }

        // 5. Mở Modal Sửa
        function openEditModal(id) {
            document.getElementById('modalTitle').innerText = 'Cập nhật thông tin phòng học';
            fetch(`${API_URL}/${id}`)
                .then(res => res.json())
                .then(room => {
                    document.getElementById('roomId').value = room.id;
                    document.getElementById('roomCode').value = room.roomCode || room.room_code || '';
                    document.getElementById('roomName').value = room.roomName || room.room_name || '';
                    document.getElementById('capacity').value = room.capacity || '';
                    document.getElementById('building').value = room.building || '';
                    roomModal.show();
                })
                .catch(err => {
                    console.error('Lỗi lấy chi tiết phòng học:', err);
                    alert('Không thể tải thông tin phòng học!');
                });
        }

        // 6. Lưu dữ liệu (Thêm mới hoặc Cập nhật)
        function saveRoom() {
            const id = document.getElementById('roomId').value;
            const roomData = {
                roomCode: document.getElementById('roomCode').value.trim(),
                roomName: document.getElementById('roomName').value.trim(),
                capacity: parseInt(document.getElementById('capacity').value) || 0,
                building: document.getElementById('building').value.trim()
            };

            if (!roomData.roomCode || !roomData.roomName) {
                alert('Vui lòng nhập Mã phòng và Tên phòng!');
                return;
            }

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(roomData)
            })
            .then(res => {
                if (!res.ok) throw new Error('Lưu thất bại');
                return res.json();
            })
            .then(() => {
                roomModal.hide();
                loadRooms();
            })
            .catch(err => {
                console.error('Lỗi lưu:', err);
                alert('Có lỗi xảy ra khi lưu dữ liệu!');
            });
        }

        // 7. Xóa phòng học
        function deleteRoom(id) {
            if (confirm('Bạn có chắc chắn muốn xóa phòng học này không?')) {
                fetch(`${API_URL}/${id}`, { method: 'DELETE' })
                .then(res => {
                    if (!res.ok) throw new Error('Xóa thất bại');
                    loadRooms();
                })
                .catch(err => {
                    console.error('Lỗi xóa:', err);
                    alert('Không thể xóa phòng học này!');
                });
            }
        }
    </script>
</body>
</html>
